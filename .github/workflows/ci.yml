# CI — build + tests on every push and PR.
#
# Cloudflare Pages also runs the build on its own infrastructure when main
# updates; this workflow exists so PRs (which CF Pages builds as preview
# deploys but doesn't gate on) get a green-or-red status check in GitHub
# before Owen merges.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:once
