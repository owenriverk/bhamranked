# Explicit Cloudflare Pages deploy.
#
# Cloudflare Pages auto-builds on push to main when the GitHub integration
# is connected — so this workflow is OPTIONAL. It exists for two cases:
#
#   1. Preview deploys on PR branches (CF Pages does build previews too,
#      but routing them to a specific custom alias works better via
#      `cloudflare/pages-action`).
#   2. Bypass / manual re-deploy when the GitHub <-> CF webhook is broken.
#
# Owen-side setup (one-time):
#   - In Cloudflare → My Profile → API Tokens, create a token with
#     "Cloudflare Pages: Edit" permission. Add to GitHub repo as
#     CLOUDFLARE_API_TOKEN secret.
#   - Find your Cloudflare account ID (dashboard sidebar). Add as
#     CLOUDFLARE_ACCOUNT_ID secret.
#
# Remove this file entirely if you don't want a redundant deploy path —
# CF Pages' built-in GitHub integration covers the happy path.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: bhamranked
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main
