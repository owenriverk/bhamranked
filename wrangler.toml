# Cloudflare Pages configuration for bhamranked.com.
#
# This file is for `wrangler pages dev` local previews and signals to
# Cloudflare that this is a Pages project (not a Worker). Cloudflare's
# build pipeline reads `pages_build_output_dir` to find the static
# output. KV bindings, env vars, and routes for Pages Functions are
# configured in the CF dashboard, NOT here.
#
# Owen-side dashboard actions (one-time, see DEPLOY.md):
#   1. Create Pages project named `bhamranked`, link to GitHub repo.
#   2. Build command: npm run build
#      Output directory: dist
#      Node version: 22
#      Deploy command: <leave empty> — Pages auto-publishes the output.
#   3. Optional KV binding: Pages → Settings → Functions → KV namespace
#      bindings → bind `LAST_PUBLISHED` to a namespace named
#      `bhamranked-last-published`. Lets you flip USE_DIFF=true in
#      functions/indexnow.ts later.
#   4. Production env var INDEXNOW_KEY → the 32-char key matching
#      public/{key}.txt.

name = "bhamranked"
compatibility_date = "2026-05-14"
pages_build_output_dir = "dist"

# Pages Functions live under ./functions/ and Cloudflare picks them up
# automatically. KV bindings, secrets, and route overrides are set in
# the dashboard so this file stays minimal and avoids the "wrangler
# treated this as a Worker project" deploy failure mode.
